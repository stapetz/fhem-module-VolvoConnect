name: Generate FHEM Controls

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGED from Git commits
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          import textwrap
          import unicodedata
          from pathlib import Path

          log = subprocess.check_output(
              [
                  "git",
                  "log",
                  "--all",
                  "--no-merges",
                  "--date=short",
                  "--pretty=format:%ad%x09%h%x09%s",
              ],
              text=True,
          )

          output = [
              "# VolvoConnect change history",
              "# Generated from Git commits by the GitHub Actions workflow.",
              "# Keep this file ASCII-only and use lines no longer than 80 characters.",
              "",
          ]

          for entry in log.splitlines():
              date, commit, subject = entry.split("\t", 2)
              if "[skip ci]" in subject or subject.startswith(
                  "Automated update of controls_"
              ):
                  continue

              subject_lower = subject.lower()
              if subject_lower.startswith(("fix", "bugfix")):
                  category = "bugfix"
              elif subject_lower.startswith(("feat", "feature")):
                  category = "feature"
              elif subject_lower.startswith(("doc", "documentation")):
                  category = "documentation"
              else:
                  category = "change"

              line = f"- {category}: {date} {commit} {subject}"
              line = unicodedata.normalize("NFKD", line)
              line = line.encode("ascii", "ignore").decode("ascii")
              output.extend(textwrap.wrap(
                  line,
                  width=79,
                  subsequent_indent="  ",
                  break_long_words=False,
                  break_on_hyphens=False,
              ))

          Path("CHANGED").write_text("\n".join(output) + "\n", encoding="ascii")
          PY

      - name: Generate Controls Files
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          modules = {
              "controls_volvo.txt": "FHEM/50_VolvoConnect.pm",
              "controls_gavazzi.txt": "FHEM/70_GavazziEM24.pm",
              "controls_solax.txt": "FHEM/98_ModbusSolax.pm",
          }
          changed = Path("CHANGED")
          changed_timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d_%H:%M:%S")

          def last_update(path):
              return subprocess.check_output(
                  [
                      "git",
                      "log",
                      "--pretty=format:%cd",
                      "-n",
                      "1",
                      "--date=format:%Y-%m-%d_%H:%M:%S",
                      "--",
                      str(path),
                  ],
                  text=True,
              ).strip()

          for controls_name, module_name in modules.items():
              module = Path(module_name)
              lines = [
                  f"UPD {last_update(module)} {module.stat().st_size} {module_name}",
                  f"UPD {changed_timestamp} {changed.stat().st_size} CHANGED",
              ]
              Path(controls_name).write_text("\n".join(lines) + "\n", encoding="ascii")
          PY

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of controls files [skip ci]"
          file_pattern: "controls_*.txt CHANGED"